<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>بوابة ولي الأمر</title>
<link rel="stylesheet" href="style.css"/>

<style>
.parent-card{
max-width:1050px;
margin:auto;
background:#111827;
border-radius:24px;
padding:24px;
}

.parent-header{
text-align:center;
margin-bottom:22px;
}

.parent-logo{
width:95px;
height:95px;
border-radius:50%;
object-fit:cover;
}

#reportArea .stats-grid{
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:16px;
}

#reportArea .stat-card{
min-height:125px;
padding:16px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

#reportArea .stat-title{
font-size:14px;
font-weight:800;
color:#94a3b8;
margin-bottom:8px;
}

#reportArea .stat-number{
font-size:21px;
font-weight:900;
line-height:1.45;
color:#facc15;
overflow-wrap:anywhere;
word-break:normal;
}

#averageBox{
font-size:28px !important;
}

.status-badge,
.curriculum-badge{
display:inline-block;
padding:5px 9px;
border-radius:12px;
font-size:12px;
font-weight:900;
white-space:nowrap;
}

.status-present{
background:rgba(34,197,94,.15);
color:#4ade80;
border:1px solid rgba(34,197,94,.35);
}

.status-absent{
background:rgba(220,38,38,.15);
color:#f87171;
border:1px solid rgba(220,38,38,.35);
}

.curriculum-basic{
background:rgba(34,197,94,.12);
color:#22c55e;
border:1px solid rgba(34,197,94,.35);
}

.curriculum-additional{
background:rgba(59,130,246,.12);
color:#60a5fa;
border:1px solid rgba(59,130,246,.35);
}

.support-message{
margin-top:22px;
padding:18px;
border-radius:16px;
color:white;
font-weight:900;
line-height:1.9;
text-align:center;
}

.designer-credit{
margin-top:25px;
text-align:center;
font-family:Calibri,Arial,sans-serif;
font-size:13px;
font-weight:900;
color:#94a3b8;
}

.table-wrap{
width:100%;
overflow-x:auto;
}

table{
width:100%;
}

@media(max-width:800px){
.parent-card{
padding:14px;
border-radius:16px;
}
table{
font-size:12px;
}
th,td{
padding:7px 5px !important;
}
}

@media print{
.search-area,
.print-actions{
display:none!important;
}

body,
.main,
.section,
.parent-card{
background:white!important;
color:black!important;
padding:0!important;
box-shadow:none!important;
}

table{
width:100%!important;
border-collapse:collapse!important;
}

th,
td{
border:1px solid #000!important;
color:#000!important;
background:white!important;
font-size:11px!important;
font-weight:900!important;
padding:5px!important;
text-align:center!important;
}

.stat-card{
background:white!important;
border:1px solid #000!important;
}

.stat-title,
.stat-number{
color:black!important;
}

.status-badge,
.curriculum-badge{
color:#000!important;
background:white!important;
border:1px solid #000!important;
}

.designer-credit{
color:black!important;
}
}
</style>
</head>

<body>

<div class="main" style="min-height:100vh;padding:25px;">

<div class="section active-section parent-card">

<div class="parent-header">
<img src="school-new1.png" class="parent-logo">
<h2 style="color:#facc15;margin:10px 0 5px;">نتائج الطالب</h2>
<div style="color:#cbd5e1;font-weight:800;">
متابعة نتائج اختبارات مادة اللغة الإنجليزية
</div>
</div>

<div class="search-area">

<div class="input-group" style="max-width:430px;margin:0 auto 18px;">
<input
type="text"
id="studentIdentityInput"
placeholder="أدخل رقم هوية الطالب"
inputmode="numeric"
autocomplete="off"
/>
</div>

<div style="text-align:center;margin-bottom:20px;">
<button class="primary-btn" onclick="searchStudent()">عرض النتائج</button>
</div>

</div>

<div id="reportArea" style="display:none;">

<div class="stats-grid" style="margin-bottom:20px;">

<div class="stat-card">
<div class="stat-title">اسم الطالب</div>
<div class="stat-number" id="studentNameBox">-</div>
</div>

<div class="stat-card">
<div class="stat-title">الفصل</div>
<div class="stat-number" id="classNameBox">-</div>
</div>

<div class="stat-card">
<div class="stat-title">رقم الهوية</div>
<div class="stat-number" id="identityBox" style="direction:ltr;">-</div>
</div>

<div class="stat-card">
<div class="stat-title">المتوسط العام</div>
<div class="stat-number" id="averageBox">0%</div>
</div>

</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>الاختبار</th>
<th>المنهج</th>
<th>المعلم</th>
<th>الحالة</th>
<th>درجة الطالب</th>
<th>الدرجة النهائية</th>
<th>النسبة</th>
<th>مؤشر الأداء</th>
</tr>
</thead>
<tbody id="gradesTable"></tbody>
</table>
</div>

<div id="supportMessage" class="support-message" style="display:none;"></div>

<div class="print-actions" style="text-align:center;margin-top:22px;">
<button class="primary-btn" onclick="window.print()">طباعة التقرير</button>
</div>

<div class="designer-credit">
تصميم وتطوير: محمد عامر أحمد
</div>

</div>

</div>

</div>

<script type="module">

import { db } from "./firebase.js";

import {
collection,
getDocs,
query,
where
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

let allExams = [];
let currentStudent = null;

function cleanIdentity(value){
return String(value || "")
.trim()
.replace(/[^\d]/g,"");
}

async function loadExams(){

allExams = [];

const snapshot = await getDocs(
collection(db,"exams")
);

snapshot.forEach(item=>{

const data = item.data();

allExams.push({
id:item.id,
examName:data.examName,
maxDegree:Number(data.maxDegree || 0),
order:Number(data.order || 999),
examScope:data.examScope || "all",
assignedClasses:Array.isArray(data.assignedClasses)
? data.assignedClasses
: [],
curriculumType:data.curriculumType || "basic"
});

});

allExams.sort((a,b)=>a.order - b.order);

}

function getChange(current,previous){

if(previous === null){
return "-";
}

if(current > previous){
return "تحسن";
}

if(current < previous){
return "تراجع";
}

return "ثابت";

}

function getSupportLevel(average){

if(average < 50){
return "case";
}

if(average < 70){
return "care";
}

return "normal";

}

async function getAssignmentsForClass(className){

const snapshot = await getDocs(
query(
collection(db,"assignments"),
where("className","==",className)
)
);

const assignments = [];

snapshot.forEach(item=>{

const data = item.data();

assignments.push({
teacherName:data.teacherName || "-",
className:data.className || "",
curriculumType:data.curriculumType || "basic"
});

});

return assignments;

}

function examAllowedForStudent(exam,className,assignments){

const curriculumType =
exam.curriculumType || "basic";

const hasMatchingTeacher =
assignments.some(item=>
(item.curriculumType || "basic") === curriculumType
);

if(!hasMatchingTeacher){
return false;
}

if(
!exam.examScope ||
exam.examScope === "all"
){
return true;
}

if(exam.examScope === "selected"){
return (
Array.isArray(exam.assignedClasses)
&&
exam.assignedClasses.includes(className)
);
}

return false;

}

window.searchStudent = async function(){

const identityInput =
cleanIdentity(
document.getElementById("studentIdentityInput").value
);

if(!identityInput){
alert("أدخل رقم هوية الطالب");
return;
}

document.getElementById("reportArea").style.display = "none";

const studentsSnapshot =
await getDocs(collection(db,"students"));

currentStudent = null;

studentsSnapshot.forEach(item=>{

if(currentStudent){
return;
}

const data = item.data();

const studentIdentity =
cleanIdentity(
data.identityNumber ||
data.nationalId ||
data.identity ||
""
);

if(studentIdentity === identityInput){

currentStudent = {
id:item.id,
...data
};

}

});

if(!currentStudent){
alert("لم يتم العثور على طالب بهذا الرقم");
return;
}

await loadStudentReport();

};

async function loadStudentReport(){

const student = currentStudent;

if(!student){
return;
}

await loadExams();

const assignments =
await getAssignmentsForClass(
student.className
);

const allowedExams =
allExams.filter(exam=>
examAllowedForStudent(
exam,
student.className,
assignments
)
);

const gradesSnapshot = await getDocs(
query(
collection(db,"grades"),
where("studentName","==",student.name),
where("className","==",student.className)
)
);

const grades = [];

gradesSnapshot.forEach(item=>{
grades.push({
id:item.id,
...item.data()
});
});

document.getElementById("studentNameBox").innerText =
student.name || "-";

document.getElementById("classNameBox").innerText =
student.className || "-";

document.getElementById("identityBox").innerText =
student.identityNumber ||
student.nationalId ||
student.identity ||
"-";

let html = "";
let previousPercent = null;
let totalPercent = 0;
let count = 0;

allowedExams.forEach(exam=>{

const examCurriculum =
exam.curriculumType || "basic";

const teacherAssignment =
assignments.find(item=>
(item.curriculumType || "basic") === examCurriculum
);

const teacherName =
teacherAssignment
?
teacherAssignment.teacherName
:
"-";

const gradeData =
grades.find(item=>
item.examName === exam.examName
&&
(item.curriculumType || "basic") === examCurriculum
&&
(
!item.teacherName
||
item.teacherName === teacherName
)
)
||
grades.find(item=>
item.examName === exam.examName
&&
item.teacherName === teacherName
)
||
grades.find(item=>
item.examName === exam.examName
);

const attendance =
gradeData?.attendance ||
(
gradeData &&
gradeData.grade !== ""
&&
gradeData.grade !== undefined
?
"present"
:
""
);

const curriculumLabel =
examCurriculum === "additional"
?
"المنهج الإضافي"
:
"المنهج الأساسي";

const curriculumClass =
examCurriculum === "additional"
?
"curriculum-additional"
:
"curriculum-basic";

if(attendance === "absent"){

html += `
<tr>
<td>${exam.examName}</td>
<td><span class="curriculum-badge ${curriculumClass}">${curriculumLabel}</span></td>
<td>${teacherName}</td>
<td><span class="status-badge status-absent">غائب</span></td>
<td>-</td>
<td>${exam.maxDegree}</td>
<td>-</td>
<td>غائب</td>
</tr>
`;

return;
}

if(
gradeData &&
gradeData.grade !== "" &&
gradeData.grade !== undefined &&
gradeData.grade !== null
){

const grade =
Number(gradeData.grade);

const maxDegree =
Number(
gradeData.maxDegree ||
exam.maxDegree ||
0
);

const percent =
maxDegree
?
Math.round(
(grade / maxDegree) * 100
)
:
0;

const change =
getChange(
percent,
previousPercent
);

previousPercent = percent;
totalPercent += percent;
count++;

html += `
<tr>
<td>${exam.examName}</td>
<td><span class="curriculum-badge ${curriculumClass}">${curriculumLabel}</span></td>
<td>${teacherName}</td>
<td><span class="status-badge status-present">حاضر</span></td>
<td>${grade}</td>
<td>${maxDegree}</td>
<td>${percent}%</td>
<td>${change}</td>
</tr>
`;

}else{

html += `
<tr>
<td>${exam.examName}</td>
<td><span class="curriculum-badge ${curriculumClass}">${curriculumLabel}</span></td>
<td>${teacherName}</td>
<td>-</td>
<td>-</td>
<td>${exam.maxDegree}</td>
<td>-</td>
<td>-</td>
</tr>
`;

}

});

if(allowedExams.length === 0){

html = `
<tr>
<td colspan="8">
لا توجد اختبارات مسندة للطالب حتى الآن
</td>
</tr>
`;

}

const average =
count
?
Math.round(
totalPercent / count
)
:
0;

document.getElementById("averageBox").innerText =
count
?
average + "%"
:
"-";

document.getElementById("gradesTable").innerHTML =
html;

const supportLevel =
getSupportLevel(average);

const supportMessage =
document.getElementById("supportMessage");

if(
count > 0 &&
supportLevel === "care"
){

supportMessage.style.display = "block";
supportMessage.style.background = "#f97316";

supportMessage.innerText =
"المكرم ولي أمر الطالب، نحيطكم علمًا بأنه تم إدراج ابنكم ضمن برنامج دعم الطلاب في مادة اللغة الإنجليزية، وذلك بهدف تعزيز مستوى التحصيل الدراسي ومعالجة جوانب الضعف الأكاديمية من خلال خطة دعم ومتابعة تعليمية مستمرة.";

}else if(
count > 0 &&
supportLevel === "case"
){

supportMessage.style.display = "block";
supportMessage.style.background = "#dc2626";

supportMessage.innerText =
"المكرم ولي أمر الطالب، نحيطكم علمًا بأنه تم إدراج ابنكم ضمن برنامج دعم الطلاب المكثف في مادة اللغة الإنجليزية، وذلك نظرًا لحاجته إلى متابعة تعليمية إضافية؛ بهدف رفع مستوى الأداء الأكاديمي وتحسين نتائج الاختبارات القادمة.";

}else{

supportMessage.style.display = "none";

}

document.getElementById("reportArea").style.display = "block";

}

</script>

</body>
</html>
