<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Supervisor Panel</title>
<link rel="stylesheet" href="style.css"/>

<style>
.message-tools{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
  margin-bottom:20px;
}

.message-text{
  max-width:360px;
  white-space:pre-wrap;
  line-height:1.8;
  font-size:13px;
}

.status-sent{
  display:inline-block;
  background:#14532d;
  color:#bbf7d0;
  padding:5px 10px;
  border-radius:10px;
  font-weight:bold;
  white-space:nowrap;
}

.message-action-btn{
  border:none;
  border-radius:8px;
  padding:7px 10px;
  cursor:pointer;
  font-family:'Cairo',sans-serif;
  font-weight:bold;
}

.delete-message-btn{
  background:#dc2626;
  color:white;
}

.message-empty{
  text-align:center;
  padding:25px;
  color:#94a3b8;
}
</style>

</head>

<body>

<div class="dashboard-layout">

<div class="sidebar">
  <div class="logo-box">Rased<br>Insights</div>

  <div class="user-box">
    <div class="user-title">المشرف الحالي</div>
    <div class="user-name" id="supervisorName">Supervisor</div>
  </div>

  <div class="menu">

    <button onclick="showSection('reportsSection')">
      متابعة النتائج
    </button>

    <button onclick="showMessagesSection()">
      سجل الرسائل
    </button>

    <button onclick="window.location.href='analysis.html'">
      تحليل النتائج
    </button>

    <button onclick="window.location.href='reports.html'">
      التقارير التحليلية
    </button>

    <button onclick="archiveResults()">
      أرشفة النتائج
    </button>

    <button onclick="window.location.href='archive.html'">
      عرض الأرشيف
    </button>

    <button class="logout-btn" onclick="logout()">
      تسجيل الخروج
    </button>

  </div>
</div>


<div class="main">

<!-- =====================================
     متابعة النتائج
===================================== -->

<div class="section active-section" id="reportsSection">

  <div class="section-header">
    <div class="section-title">
      متابعة نتائج الطلاب
    </div>
  </div>

  <div
    style="
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:15px;
      margin-bottom:25px;
    "
  >

    <div class="input-group">
      <select id="teacherSelect">
        <option>اختر المعلم</option>
      </select>
    </div>

    <div class="input-group">
      <select id="classSelect">
        <option>اختر الفصل</option>
      </select>
    </div>

  </div>

  <div style="overflow:auto;">
    <table>
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

</div>


<!-- =====================================
     سجل الرسائل
===================================== -->

<div class="section" id="messagesSection">

  <div class="section-header">
    <div class="section-title">
      سجل رسائل أولياء الأمور
    </div>
  </div>


  <div class="message-tools">

    <div class="input-group">
      <select id="messageTeacherFilter">
        <option value="">جميع المعلمين</option>
      </select>
    </div>

    <div class="input-group">
      <select id="messageClassFilter">
        <option value="">جميع الفصول</option>
      </select>
    </div>

    <div class="input-group">
      <input
        type="text"
        id="messageStudentSearch"
        placeholder="بحث باسم الطالب..."
      />
    </div>

  </div>


  <div
    style="
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:20px;
    "
  >

    <button
      class="primary-btn"
      onclick="printMessages()"
    >
      طباعة السجل
    </button>

    <button
      class="primary-btn"
      style="
        background:#7f1d1d;
        color:white;
      "
      onclick="deleteAllMessages()"
    >
      حذف جميع الرسائل
    </button>

  </div>


  <div style="overflow:auto;">

    <table>

      <thead>

        <tr>

          <th>م</th>

          <th>الطالب</th>

          <th>الفصل</th>

          <th>المعلم</th>

          <th>رقم ولي الأمر</th>

          <th>الرسالة</th>

          <th>التاريخ</th>

          <th>الوقت</th>

          <th>الحالة</th>

          <th>حذف</th>

        </tr>

      </thead>

      <tbody id="messagesTableBody">

        <tr>
          <td colspan="10" class="message-empty">
            لا توجد رسائل
          </td>
        </tr>

      </tbody>

    </table>

  </div>

</div>

</div>

</div>



<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  getDocs,
  query,
  where,
  addDoc,
  deleteDoc,
  doc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================================
   حماية الصفحة
========================================= */

if (
  localStorage.getItem("rasedRole") !== "supervisor"
) {
  window.location.href = "index.html";
}


/* =========================================
   بيانات المشرف
========================================= */

const supervisorName =
  localStorage.getItem("supervisorName") || "Supervisor";

document.getElementById("supervisorName").innerText =
  supervisorName;


/* =========================================
   العناصر
========================================= */

const teacherSelect =
  document.getElementById("teacherSelect");

const classSelect =
  document.getElementById("classSelect");

const tableHead =
  document.getElementById("tableHead");

const tableBody =
  document.getElementById("tableBody");

const messagesTableBody =
  document.getElementById("messagesTableBody");

const messageTeacherFilter =
  document.getElementById("messageTeacherFilter");

const messageClassFilter =
  document.getElementById("messageClassFilter");

const messageStudentSearch =
  document.getElementById("messageStudentSearch");


/* =========================================
   المتغيرات
========================================= */

let allExams = [];
let exams = [];
let allGrades = [];
let currentStudents = [];
let allMessages = [];


/* =========================================
   الأقسام
========================================= */

window.showSection =
function(id) {

  document
    .querySelectorAll(".section")
    .forEach(section => {

      section.classList.remove(
        "active-section"
      );

    });

  document
    .getElementById(id)
    .classList.add(
      "active-section"
    );

};


window.showMessagesSection =
async function() {

  window.showSection(
    "messagesSection"
  );

  await loadAllMessages();

};


/* =========================================
   تحميل المعلمين
========================================= */

async function loadTeachers() {

  teacherSelect.innerHTML =
    "<option>اختر المعلم</option>";

  messageTeacherFilter.innerHTML =
    '<option value="">جميع المعلمين</option>';

  const snapshot =
    await getDocs(
      collection(db, "teachers")
    );

  const teachers = [];

  snapshot.forEach(item => {

    const name =
      item.data().name;

    if (
      name &&
      !teachers.includes(name)
    ) {

      teachers.push(name);

    }

  });

  teachers.sort(
    (a,b) =>
      a.localeCompare(
        b,
        "ar"
      )
  );

  teachers.forEach(name => {

    teacherSelect.innerHTML += `
      <option>${name}</option>
    `;

    messageTeacherFilter.innerHTML += `
      <option value="${name}">
        ${name}
      </option>
    `;

  });

}


/* =========================================
   تحميل جميع الاختبارات
========================================= */

async function loadExams() {

  allExams = [];

  const snapshot =
    await getDocs(
      collection(db, "exams")
    );

  snapshot.forEach(item => {

    const data =
      item.data();

    allExams.push({

      id:item.id,

      examName:
        data.examName,

      maxDegree:
        Number(
          data.maxDegree || 0
        ),

      order:
        Number(
          data.order || 999
        ),

      examScope:
        data.examScope || "all",

      assignedClasses:
        Array.isArray(
          data.assignedClasses
        )
        ?
        data.assignedClasses
        :
        []

    });

  });

  allExams.sort(
    (a,b) =>
      a.order - b.order
  );

}


/* =========================================
   فلترة الاختبارات
========================================= */

function filterExamsForClass(className) {

  exams =
    allExams.filter(exam => {

      if (
        !exam.examScope ||
        exam.examScope === "all"
      ) {

        return true;

      }

      if (
        exam.examScope === "selected"
      ) {

        return (
          Array.isArray(
            exam.assignedClasses
          )
          &&
          exam.assignedClasses.includes(
            className
          )
        );

      }

      return true;

    });

}


/* =========================================
   تحميل الدرجات
========================================= */

async function loadAllGrades() {

  allGrades = [];

  const snapshot =
    await getDocs(
      collection(db, "grades")
    );

  snapshot.forEach(item => {

    allGrades.push({
      id:item.id,
      ...item.data()
    });

  });

}


/* =========================================
   الأحداث
========================================= */

teacherSelect.addEventListener(
  "change",
  loadTeacherClasses
);

classSelect.addEventListener(
  "change",
  loadReportTable
);


/* =========================================
   فصول المعلم
========================================= */

async function loadTeacherClasses() {

  classSelect.innerHTML =
    "<option>اختر الفصل</option>";

  tableHead.innerHTML = "";
  tableBody.innerHTML = "";

  exams = [];

  const teacherName =
    teacherSelect.value;

  if (
    teacherName ===
    "اختر المعلم"
  ) {

    return;

  }

  const snapshot =
    await getDocs(

      query(

        collection(
          db,
          "assignments"
        ),

        where(
          "teacherName",
          "==",
          teacherName
        )

      )

    );

  const classes = [];

  snapshot.forEach(item => {

    const className =
      item.data().className;

    if (
      className &&
      !classes.includes(
        className
      )
    ) {

      classes.push(
        className
      );

    }

  });

  classes.sort(
    (a,b) =>
      a.localeCompare(
        b,
        "ar",
        {
          numeric:true,
          sensitivity:"base"
        }
      )
  );

  classes.forEach(className => {

    classSelect.innerHTML += `
      <option>${className}</option>
    `;

  });

}


/* =========================================
   مؤشر التحسن
========================================= */

function getChangeLabel(
  currentPercent,
  previousPercent
) {

  if (
    previousPercent === null
  ) {

    return {
      text:"-",
      color:"#94a3b8"
    };

  }

  if (
    currentPercent > previousPercent
  ) {

    return {
      text:"↑ تحسن",
      color:"#22c55e"
    };

  }

  if (
    currentPercent < previousPercent
  ) {

    return {
      text:"↓ تراجع",
      color:"#ef4444"
    };

  }

  return {
    text:"→ ثابت",
    color:"#facc15"
  };

}


/* =========================================
   المستوى العام
========================================= */

function getOverallStatus(changes) {

  const up =
    changes.filter(
      item => item === "up"
    ).length;

  const down =
    changes.filter(
      item => item === "down"
    ).length;

  if (
    up > down
  ) {

    return {
      text:"تحسن عام",
      color:"#22c55e"
    };

  }

  if (
    down > up
  ) {

    return {
      text:"تراجع عام",
      color:"#ef4444"
    };

  }

  return {
    text:"ثابت",
    color:"#facc15"
  };

}


/* =========================================
   عرض نتائج الفصل
========================================= */

async function loadReportTable() {

  tableHead.innerHTML = "";

  tableBody.innerHTML = `
    <tr class="loading-row">
      <td colspan="50">
        جاري تحميل النتائج...
      </td>
    </tr>
  `;

  const teacherName =
    teacherSelect.value;

  const className =
    classSelect.value;

  if (
    teacherName === "اختر المعلم" ||
    className === "اختر الفصل"
  ) {

    tableBody.innerHTML = "";

    return;

  }

  filterExamsForClass(
    className
  );

  await loadAllGrades();

  if (
    exams.length === 0
  ) {

    tableBody.innerHTML = `
      <tr>
        <td colspan="50">
          لا توجد اختبارات مسندة لهذا الفصل
        </td>
      </tr>
    `;

    return;

  }


  let head = `
    <tr>
      <th>اسم الطالب</th>
  `;

  exams.forEach(exam => {

    head += `
      <th>
        ${exam.examName}
        <br>
        من ${exam.maxDegree}
      </th>
    `;

  });

  head += `
      <th>
        المستوى العام
      </th>

      <th>
        واتساب
      </th>
    </tr>
  `;

  tableHead.innerHTML =
    head;


  const studentsSnapshot =
    await getDocs(

      query(

        collection(
          db,
          "students"
        ),

        where(
          "className",
          "==",
          className
        )

      )

    );


  currentStudents = [];

  studentsSnapshot.forEach(
    studentDoc => {

      currentStudents.push(
        studentDoc.data()
      );

    }
  );

  currentStudents.sort(
    (a,b) =>
      (a.name || "")
      .localeCompare(
        b.name || "",
        "ar"
      )
  );


  let html = "";

  for (
    const student
    of
    currentStudents
  ) {

    html += `
      <tr>

        <td class="student-name">
          ${student.name}
        </td>
    `;

    let previousPercent =
      null;

    let changes = [];


    for (
      const exam
      of
      exams
    ) {

      const gradeData =
        allGrades.find(item =>

          item.studentName ===
            student.name

          &&

          item.className ===
            className

          &&

          item.examName ===
            exam.examName

          &&

          item.teacherName ===
            teacherName

        );


      if (
        gradeData &&
        gradeData.grade !== ""
      ) {

        const percent =
          exam.maxDegree
          ?
          Math.round(
            (
              Number(
                gradeData.grade
              )
              /
              Number(
                exam.maxDegree
              )
            )
            *
            100
          )
          :
          0;


        const change =
          getChangeLabel(
            percent,
            previousPercent
          );


        if (
          previousPercent !== null
        ) {

          if (
            percent > previousPercent
          ) {

            changes.push("up");

          }
          else if (
            percent < previousPercent
          ) {

            changes.push("down");

          }
          else {

            changes.push("stable");

          }

        }

        previousPercent =
          percent;

        let color =
          "#facc15";

        if (
          percent >= 85
        ) {

          color =
            "#22c55e";

        }
        else if (
          percent < 60
        ) {

          color =
            "#ef4444";

        }

        html += `
          <td>

            <div
              style="
                color:${color};
                font-weight:800;
              "
            >
              ${gradeData.grade} / ${exam.maxDegree}
            </div>

            <div
              style="
                color:${color};
                font-weight:700;
              "
            >
              ${percent}%
            </div>

            <div
              style="
                color:${change.color};
                font-weight:900;
                margin-top:6px;
              "
            >
              ${change.text}
            </div>

          </td>
        `;

      }
      else {

        html += `
          <td>-</td>
        `;

      }

    }


    const overall =
      getOverallStatus(
        changes
      );


    html += `

        <td
          style="
            color:${overall.color};
            font-weight:900;
          "
        >
          ${overall.text}
        </td>

        <td>

          <button
            class="primary-btn"

            style="
              background:#16a34a;
              color:white;
              padding:8px 12px;
              font-size:12px;
            "

            onclick="sendWhatsApp('${encodeURIComponent(student.name)}')"
          >
            إرسال
          </button>

        </td>

      </tr>
    `;

  }


  tableBody.innerHTML =
    html;

}


/* =========================================
   تنظيف رقم الجوال
========================================= */

function cleanPhone(phone) {

  let value =
    String(
      phone || ""
    ).trim();

  value =
    value.replace(
      /[^\d]/g,
      ""
    );

  if (
    value.startsWith("00")
  ) {

    value =
      value.slice(2);

  }

  if (
    value.startsWith("0")
  ) {

    value =
      "966" +
      value.slice(1);

  }

  if (
    !value.startsWith("966")
  ) {

    value =
      "966" + value;

  }

  return value;

}


/* =========================================
   واتساب وحفظ سجل المشرف
========================================= */

window.sendWhatsApp =
async function(
  encodedStudentName
) {

  const studentName =
    decodeURIComponent(
      encodedStudentName
    );

  const teacherName =
    teacherSelect.value;

  const className =
    classSelect.value;


  const student =
    currentStudents.find(
      item =>
        item.name ===
        studentName
    );


  if (
    !student ||
    !student.guardianPhone
  ) {

    alert(
      "رقم ولي الأمر غير موجود لهذا الطالب"
    );

    return;

  }


  const studentGrades = [];
  const gradesForArchive = [];


  exams.forEach(exam => {

    const gradeData =
      allGrades.find(item =>

        item.studentName ===
          studentName

        &&

        item.className ===
          className

        &&

        item.examName ===
          exam.examName

        &&

        item.teacherName ===
          teacherName

      );


    if (
      gradeData &&
      gradeData.grade !== ""
    ) {

      studentGrades.push(
        `${exam.examName}: ${gradeData.grade} / ${exam.maxDegree}`
      );


      gradesForArchive.push({

        examName:
          exam.examName,

        grade:
          Number(
            gradeData.grade
          ),

        maxDegree:
          Number(
            exam.maxDegree
          )

      });

    }

  });


  if (
    studentGrades.length === 0
  ) {

    alert(
      "لا توجد درجات مرصودة لهذا الطالب"
    );

    return;

  }


  const message =
`السلام عليكم ورحمة الله وبركاته

ولي أمر الطالب: ${studentName}
الفصل: ${className}

نحيطكم علمًا بدرجات الطالب في اختبارات مادة اللغة الإنجليزية:

${studentGrades.join("\n")}

المشرف: ${supervisorName}

مع تمنياتنا له بالتوفيق والنجاح.`;


  const phone =
    cleanPhone(
      student.guardianPhone
    );


  try {

    await addDoc(

      collection(
        db,
        "parentMessages"
      ),

      {

        studentName:
          studentName,

        className:
          className,

        guardianPhone:
          phone,

        teacherName:
          teacherName,

        senderName:
          supervisorName,

        senderRole:
          "supervisor",

        subject:
          "لغة إنجليزية",

        messageType:
          "نتائج اختبارات",

        messageText:
          message,

        grades:
          gradesForArchive,

        status:
          "تم الإرسال",

        sentAt:
          serverTimestamp()

      }

    );

  }
  catch(error) {

    console.error(error);

    alert(
      "حدث خطأ أثناء حفظ سجل الرسالة، ولم يتم فتح واتساب."
    );

    return;

  }


  const url =
    `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;


  window.open(
    url,
    "_blank"
  );

};


/* =========================================
   تحميل جميع الرسائل
========================================= */

async function loadAllMessages() {

  messagesTableBody.innerHTML = `
    <tr>
      <td colspan="10" class="message-empty">
        جاري تحميل السجل...
      </td>
    </tr>
  `;


  allMessages = [];


  try {

    const snapshot =
      await getDocs(
        collection(
          db,
          "parentMessages"
        )
      );


    snapshot.forEach(item => {

      allMessages.push({
        id:item.id,
        ...item.data()
      });

    });


    allMessages.sort(
      (a,b) => {

        const aTime =
          a.sentAt?.seconds || 0;

        const bTime =
          b.sentAt?.seconds || 0;

        return bTime - aTime;

      }
    );


    updateMessageFilters();

    renderMessages();

  }
  catch(error) {

    console.error(error);

    messagesTableBody.innerHTML = `
      <tr>
        <td colspan="10" class="message-empty">
          تعذر تحميل سجل الرسائل
        </td>
      </tr>
    `;

  }

}


/* =========================================
   تحديث الفلاتر
========================================= */

function updateMessageFilters() {

  const currentTeacher =
    messageTeacherFilter.value;

  const currentClass =
    messageClassFilter.value;


  const teachers = [
    ...new Set(
      allMessages
        .map(
          item => item.teacherName
        )
        .filter(Boolean)
    )
  ];


  teachers.sort(
    (a,b) =>
      a.localeCompare(
        b,
        "ar"
      )
  );


  messageTeacherFilter.innerHTML =
    `
      <option value="">
        جميع المعلمين
      </option>
    `;


  teachers.forEach(
    teacherName => {

      messageTeacherFilter.innerHTML += `
        <option value="${teacherName}">
          ${teacherName}
        </option>
      `;

    }
  );


  if (
    teachers.includes(
      currentTeacher
    )
  ) {

    messageTeacherFilter.value =
      currentTeacher;

  }


  updateMessageClassFilter(
    currentClass
  );

}


/* =========================================
   فلتر الفصول حسب المعلم
========================================= */

function updateMessageClassFilter(
  previousValue = ""
) {

  const selectedTeacher =
    messageTeacherFilter.value;


  const source =
    selectedTeacher
    ?
    allMessages.filter(
      item =>
        item.teacherName ===
        selectedTeacher
    )
    :
    allMessages;


  const classes = [
    ...new Set(
      source
        .map(
          item => item.className
        )
        .filter(Boolean)
    )
  ];


  classes.sort(
    (a,b) =>
      a.localeCompare(
        b,
        "ar",
        {
          numeric:true
        }
      )
  );


  messageClassFilter.innerHTML =
    `
      <option value="">
        جميع الفصول
      </option>
    `;


  classes.forEach(
    className => {

      messageClassFilter.innerHTML += `
        <option value="${className}">
          ${className}
        </option>
      `;

    }
  );


  if (
    classes.includes(
      previousValue
    )
  ) {

    messageClassFilter.value =
      previousValue;

  }

}


/* =========================================
   التاريخ والوقت
========================================= */

function getMessageDate(
  sentAt
) {

  if (
    !sentAt ||
    !sentAt.toDate
  ) {

    return {
      date:"-",
      time:"-"
    };

  }


  const date =
    sentAt.toDate();


  return {

    date:
      date.toLocaleDateString(
        "ar-SA"
      ),

    time:
      date.toLocaleTimeString(
        "ar-SA",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      )

  };

}


/* =========================================
   حماية النص
========================================= */

function escapeHtml(value) {

  return String(
    value || ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================
   عرض السجل
========================================= */

function renderMessages() {

  const teacherValue =
    messageTeacherFilter.value;

  const classValue =
    messageClassFilter.value;

  const studentValue =
    messageStudentSearch.value
      .trim()
      .toLowerCase();


  const filtered =
    allMessages.filter(
      item => {

        const matchesTeacher =
          !teacherValue
          ||
          item.teacherName ===
          teacherValue;


        const matchesClass =
          !classValue
          ||
          item.className ===
          classValue;


        const matchesStudent =
          !studentValue
          ||
          String(
            item.studentName || ""
          )
          .toLowerCase()
          .includes(
            studentValue
          );


        return (
          matchesTeacher &&
          matchesClass &&
          matchesStudent
        );

      }
    );


  if (
    filtered.length === 0
  ) {

    messagesTableBody.innerHTML = `
      <tr>
        <td colspan="10" class="message-empty">
          لا توجد رسائل مطابقة
        </td>
      </tr>
    `;

    return;

  }


  let html = "";


  filtered.forEach(
    (item,index) => {

      const dateInfo =
        getMessageDate(
          item.sentAt
        );


      html += `
        <tr>

          <td>
            ${index + 1}
          </td>

          <td class="student-name">
            ${escapeHtml(item.studentName)}
          </td>

          <td>
            ${escapeHtml(item.className)}
          </td>

          <td>
            ${escapeHtml(item.teacherName)}
          </td>

          <td>
            ${escapeHtml(item.guardianPhone)}
          </td>

          <td>
            <div class="message-text">
              ${escapeHtml(item.messageText)}
            </div>
          </td>

          <td>
            ${dateInfo.date}
          </td>

          <td>
            ${dateInfo.time}
          </td>

          <td>
            <span class="status-sent">
              ${escapeHtml(item.status || "تم الإرسال")}
            </span>
          </td>

          <td>

            <button
              class="
                message-action-btn
                delete-message-btn
              "
              onclick="deleteMessage('${item.id}')"
            >
              حذف
            </button>

          </td>

        </tr>
      `;

    }
  );


  messagesTableBody.innerHTML =
    html;

}

/* =========================================
   حذف رسالة واحدة
========================================= */

window.deleteMessage =
async function(messageId) {

  const message =
    allMessages.find(
      item =>
        item.id === messageId
    );


  if (
    !message
  ) {

    return;

  }


  const confirmDelete =
    confirm(
      `هل تريد حذف رسالة الطالب "${message.studentName}" من السجل؟`
    );


  if (
    !confirmDelete
  ) {

    return;

  }


  try {

    await deleteDoc(

      doc(
        db,
        "parentMessages",
        messageId
      )

    );


    allMessages =
      allMessages.filter(
        item =>
          item.id !== messageId
      );


    updateMessageFilters();

    renderMessages();


    alert(
      "تم حذف الرسالة"
    );

  }
  catch(error) {

    console.error(error);

    alert(
      "تعذر حذف الرسالة"
    );

  }

};


/* =========================================
   حذف جميع الرسائل
========================================= */

window.deleteAllMessages =
async function() {

  if (
    allMessages.length === 0
  ) {

    alert(
      "لا توجد رسائل للحذف"
    );

    return;

  }


  const confirmDelete =
    confirm(
      "هل أنت متأكد من حذف جميع سجلات الرسائل لكل المعلمين؟ لا يمكن التراجع عن هذه العملية."
    );


  if (
    !confirmDelete
  ) {

    return;

  }


  try {

    for (
      const item
      of
      allMessages
    ) {

      await deleteDoc(

        doc(
          db,
          "parentMessages",
          item.id
        )

      );

    }


    allMessages = [];

    updateMessageFilters();

    renderMessages();


    alert(
      "تم حذف جميع سجلات الرسائل"
    );

  }
  catch(error) {

    console.error(error);

    alert(
      "حدث خطأ أثناء حذف السجل"
    );

  }

};

  ) {

    await addDoc(
      collection(

      ),
      {

          data.studentName,

        className:
          data.className,

        subject:
          data.subject,

          data.examName,
