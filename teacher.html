<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Teacher Panel</title>
<link rel="stylesheet" href="style.css"/>

<style>
.message-tools{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
  margin-bottom:20px;
}

.status-sent{
  display:inline-block;
  background:#14532d;
  color:#bbf7d0;
  padding:5px 10px;
  border-radius:10px;
  font-weight:bold;
  white-space:nowrap;
}

.sender-badge{
  display:inline-block;
  background:#1e3a8a;
  color:#dbeafe;
  padding:5px 10px;
  border-radius:10px;
  font-size:12px;
  font-weight:bold;
  white-space:nowrap;
}

.message-action-btn{
  border:none;
  border-radius:8px;
  padding:7px 10px;
  cursor:pointer;
  font-family:'Cairo',sans-serif;
  font-weight:bold;
}

.delete-message-btn{
  background:#dc2626;
  color:white;
}

.message-empty{
  text-align:center;
  padding:25px;
  color:#94a3b8;
}

.message-details{
  width:260px;
  margin:auto;
}

.message-details summary{
  cursor:pointer;
  background:#334155;
  color:white;
  border-radius:8px;
  padding:7px 10px;
  font-size:12px;
  font-weight:bold;
  text-align:center;
  list-style:none;
}

.message-details summary::-webkit-details-marker{
  display:none;
}

.message-scroll-box{
  margin-top:7px;
  background:#020617;
  border:1px solid #475569;
  border-radius:8px;
  padding:10px;
  max-height:150px;
  overflow-y:auto;
  white-space:pre-wrap;
  line-height:1.7;
  font-size:12px;
  text-align:right;
  color:#e2e8f0;
}
</style>
</head>

<body>

<div class="dashboard-layout">

<div class="sidebar">

  <div class="logo-box">Rased<br>Insights</div>

  <div class="user-box">
    <div class="user-title">المعلم الحالي</div>
    <div class="user-name" id="teacherName">Teacher</div>
  </div>

  <div class="menu">

    <button onclick="showSection('gradesSection')">
      إدخال الدرجات
    </button>

    <button onclick="showMessagesSection()">
      سجل الرسائل
    </button>

    <button class="logout-btn" onclick="logout()">
      تسجيل الخروج
    </button>

  </div>
</div>


<div class="main">

<div class="section active-section" id="gradesSection">

  <div class="section-header">
    <div class="section-title">إدخال درجات الطلاب</div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px;margin-bottom:25px;">

    <div class="input-group">
      <select id="classSelect">
        <option>اختر الفصل</option>
      </select>
    </div>

    <div class="input-group">
      <input type="text" value="لغة إنجليزية" readonly/>
    </div>

    <div class="input-group">
      <select id="clearExamSelect">
        <option>اختر اختبار للتفريغ</option>
      </select>
    </div>

  </div>

  <div style="overflow:auto;">
    <table>
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div style="margin-top:20px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;">

    <button class="primary-btn" onclick="saveAllGrades()">
      حفظ جميع الدرجات
    </button>

    <button
      class="primary-btn"
      style="background:#dc2626;color:white;"
      onclick="clearSelectedExam()"
    >
      تفريغ الاختبار المحدد
    </button>

    <button
      class="primary-btn"
      style="background:#7f1d1d;color:white;"
      onclick="clearAllExams()"
    >
      تفريغ جميع الاختبارات
    </button>

  </div>

</div>


<div class="section" id="messagesSection">

  <div class="section-header">
    <div class="section-title">
      سجل رسائل أولياء الأمور
    </div>
  </div>

  <div class="message-tools">

    <div class="input-group">
      <input
        type="text"
        id="messageSearch"
        placeholder="بحث باسم الطالب..."
      />
    </div>

    <div class="input-group">
      <select id="messageClassFilter">
        <option value="">جميع الفصول</option>
      </select>
    </div>

  </div>

  <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;">

    <button class="primary-btn" onclick="printMessages()">
      طباعة السجل
    </button>

    <button
      class="primary-btn"
      style="background:#7f1d1d;color:white;"
      onclick="deleteAllTeacherMessages()"
    >
      حذف جميع الرسائل
    </button>

  </div>

  <div style="overflow:auto;">

    <table>

      <thead>
        <tr>
          <th>م</th>
          <th>الطالب</th>
          <th>الفصل</th>
          <th>المرسل</th>
          <th>رقم ولي الأمر</th>
          <th>الرسالة</th>
          <th>التاريخ</th>
          <th>الوقت</th>
          <th>الحالة</th>
          <th>حذف</th>
        </tr>
      </thead>

      <tbody id="messagesTableBody">

        <tr>
          <td colspan="10" class="message-empty">
            لا توجد رسائل
          </td>
        </tr>

      </tbody>

    </table>

  </div>

</div>

</div>
</div>


<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  getDocs,
  query,
  where,
  addDoc,
  updateDoc,
  deleteDoc,
  doc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


if(localStorage.getItem("rasedRole") !== "teacher"){
  window.location.href = "index.html";
}


const teacherName =
  localStorage.getItem("teacherName");

document.getElementById("teacherName").innerText =
  teacherName || "Teacher";


const classSelect =
  document.getElementById("classSelect");

const clearExamSelect =
  document.getElementById("clearExamSelect");

const tableHead =
  document.getElementById("tableHead");

const tableBody =
  document.getElementById("tableBody");

const messagesTableBody =
  document.getElementById("messagesTableBody");

const messageSearch =
  document.getElementById("messageSearch");

const messageClassFilter =
  document.getElementById("messageClassFilter");


let allExams = [];
let exams = [];
let allGrades = [];
let currentStudents = [];
let teacherMessages = [];


window.showSection = function(id){

  document
    .querySelectorAll(".section")
    .forEach(section=>{
      section.classList.remove("active-section");
    });

  document
    .getElementById(id)
    .classList.add("active-section");

};


window.showMessagesSection =
async function(){

  window.showSection("messagesSection");

  await loadTeacherMessages();

};


async function loadTeacherClasses(){

  classSelect.innerHTML =
    "<option>اختر الفصل</option>";

  const snapshot =
    await getDocs(
      query(
        collection(db,"assignments"),
        where("teacherName","==",teacherName)
      )
    );

  const classes = [];

  snapshot.forEach(item=>{

    const className =
      item.data().className;

    if(
      className &&
      !classes.includes(className)
    ){
      classes.push(className);
    }

  });

  classes.sort((a,b)=>
    a.localeCompare(
      b,
      "ar",
      {
        numeric:true,
        sensitivity:"base"
      }
    )
  );

  classes.forEach(className=>{

    classSelect.innerHTML += `
      <option value="${className}">
        ${className}
      </option>
    `;

  });

}


async function loadAllExams(){

  allExams = [];

  const snapshot =
    await getDocs(
      collection(db,"exams")
    );

  snapshot.forEach(item=>{

    const data =
      item.data();

    allExams.push({

      id:item.id,

      examName:data.examName,

      maxDegree:
        Number(data.maxDegree || 0),

      order:
        Number(data.order || 999),

      examScope:
        data.examScope || "all",

      assignedClasses:
        Array.isArray(data.assignedClasses)
        ?
        data.assignedClasses
        :
        []

    });

  });

  allExams.sort(
    (a,b)=>a.order-b.order
  );

}


function filterExamsForClass(className){

  exams =
    allExams.filter(exam=>{

      if(
        !exam.examScope ||
        exam.examScope === "all"
      ){
        return true;
      }

      if(
        exam.examScope === "selected"
      ){

        return (
          Array.isArray(exam.assignedClasses)
          &&
          exam.assignedClasses.includes(className)
        );

      }

      return true;

    });

}


function updateClearExamSelect(){

  clearExamSelect.innerHTML =
    "<option>اختر اختبار للتفريغ</option>";

  exams.forEach(exam=>{

    clearExamSelect.innerHTML += `
      <option value="${exam.examName}">
        ${exam.examName}
      </option>
    `;

  });

}


async function loadAllGrades(){

  allGrades = [];

  const snapshot =
    await getDocs(
      query(
        collection(db,"grades"),
        where("teacherName","==",teacherName)
      )
    );

  snapshot.forEach(item=>{

    allGrades.push({
      id:item.id,
      ...item.data()
    });

  });

}


classSelect.addEventListener(
  "change",
  loadStudentsTable
);


async function loadStudentsTable(){

  tableHead.innerHTML = "";
  tableBody.innerHTML = "";

  const className =
    classSelect.value;

  if(className === "اختر الفصل"){

    exams = [];

    updateClearExamSelect();

    return;
  }

  filterExamsForClass(className);

  updateClearExamSelect();

  tableBody.innerHTML = `
    <tr class="loading-row">
      <td colspan="50">
        جاري تحميل الطلاب...
      </td>
    </tr>
  `;

  await loadAllGrades();

  if(exams.length === 0){

    tableBody.innerHTML = `
      <tr>
        <td colspan="50">
          لا توجد اختبارات مسندة لهذا الفصل
        </td>
      </tr>
    `;

    return;
  }


  let head = `
    <tr>
      <th>اسم الطالب</th>
  `;

  exams.forEach(exam=>{

    head += `
      <th>
        ${exam.examName}
        <br>
        من ${exam.maxDegree}
      </th>
    `;

  });

  head += `
      <th>واتساب</th>
    </tr>
  `;

  tableHead.innerHTML = head;


  const studentsSnapshot =
    await getDocs(
      query(
        collection(db,"students"),
        where("className","==",className)
      )
    );

  currentStudents = [];

  studentsSnapshot.forEach(studentDoc=>{

    currentStudents.push(
      studentDoc.data()
    );

  });

  currentStudents.sort(
    (a,b)=>
      (a.name || "")
      .localeCompare(
        b.name || "",
        "ar"
      )
  );


  let html = "";

  for(const student of currentStudents){

    html += `
      <tr>

        <td class="student-name">
          ${student.name}
        </td>
    `;

    for(const exam of exams){

      const existingGrade =
        allGrades.find(item=>

          item.studentName === student.name
          &&
          item.className === className
          &&
          item.examName === exam.examName
          &&
          item.teacherName === teacherName

        );

      const currentGrade =
        existingGrade
        ?
        existingGrade.grade
        :
        "";

      html += `
        <td>

          <input
            type="number"
            value="${currentGrade}"
            min="0"
            max="${exam.maxDegree}"

            data-student="${student.name}"
            data-exam="${exam.examName}"
            data-max="${exam.maxDegree}"

            class="grade-input"

            style="
              width:85px;
              padding:8px;
              border:none;
              border-radius:10px;
              background:#020617;
              color:white;
              text-align:center;
            "
          />

        </td>
      `;

    }

    html += `
        <td>

          <button
            class="primary-btn"

            style="
              background:#16a34a;
              color:white;
              padding:8px 12px;
              font-size:12px;
            "

            onclick="sendWhatsApp('${encodeURIComponent(student.name)}')"
          >
            إرسال
          </button>

        </td>

      </tr>
    `;

  }

  tableBody.innerHTML = html;

}


function cleanPhone(phone){

  let value =
    String(phone || "").trim();

  value =
    value.replace(/[^\d]/g,"");

  if(value.startsWith("00")){
    value = value.slice(2);
  }

  if(value.startsWith("0")){
    value = "966" + value.slice(1);
  }

  if(!value.startsWith("966")){
    value = "966" + value;
  }

  return value;

}


window.sendWhatsApp =
async function(encodedStudentName){

  const studentName =
    decodeURIComponent(
      encodedStudentName
    );

  const className =
    classSelect.value;

  const student =
    currentStudents.find(
      item=>item.name === studentName
    );

  if(
    !student ||
    !student.guardianPhone
  ){

    alert(
      "رقم ولي الأمر غير موجود لهذا الطالب"
    );

    return;
  }


  const studentGrades = [];
  const gradesForArchive = [];

  exams.forEach(exam=>{

    const gradeData =
      allGrades.find(item=>

        item.studentName === studentName
        &&
        item.className === className
        &&
        item.examName === exam.examName
        &&
        item.teacherName === teacherName

      );

    if(
      gradeData &&
      gradeData.grade !== ""
    ){

      studentGrades.push(
        `${exam.examName}: ${gradeData.grade} / ${exam.maxDegree}`
      );

      gradesForArchive.push({

        examName:exam.examName,

        grade:
          Number(gradeData.grade),

        maxDegree:
          Number(exam.maxDegree)

      });

    }

  });


  if(studentGrades.length === 0){

    alert(
      "لا توجد درجات مرصودة لهذا الطالب"
    );

    return;
  }


  const message =
`السلام عليكم ورحمة الله وبركاته

ولي أمر الطالب: ${studentName}
الفصل: ${className}

نحيطكم علمًا بدرجات الطالب في اختبارات مادة اللغة الإنجليزية:

${studentGrades.join("\n")}

المعلم: ${teacherName}

مع تمنياتنا له بالتوفيق والنجاح.`;


  const phone =
    cleanPhone(
      student.guardianPhone
    );


  try{

    await addDoc(

      collection(
        db,
        "parentMessages"
      ),

      {

        studentName,
        className,

        guardianPhone:phone,

        teacherName,

        senderName:teacherName,

        senderRole:"teacher",

        subject:"لغة إنجليزية",

        messageType:"نتائج اختبارات",

        messageText:message,

        grades:gradesForArchive,

        status:"تم الإرسال",

        sentAt:serverTimestamp()

      }

    );

  }
  catch(error){

    console.error(error);

    alert(
      "حدث خطأ أثناء حفظ سجل الرسالة"
    );

    return;
  }


  const url =
    `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;

  window.open(
    url,
    "_blank"
  );

};


async function loadTeacherMessages(){

  messagesTableBody.innerHTML = `
    <tr>
      <td colspan="10" class="message-empty">
        جاري تحميل السجل...
      </td>
    </tr>
  `;

  teacherMessages = [];

  try{

    const snapshot =
      await getDocs(

        query(

          collection(
            db,
            "parentMessages"
          ),

          where(
            "teacherName",
            "==",
            teacherName
          )

        )

      );


    snapshot.forEach(item=>{

      const data =
        item.data();


      const isOldTeacherMessage =
        !data.senderRole;


      const isTeacherMessage =
        data.senderRole === "teacher";


      if(
        isTeacherMessage
        ||
        isOldTeacherMessage
      ){

        teacherMessages.push({
          id:item.id,
          ...data
        });

      }

    });


    teacherMessages.sort(
      (a,b)=>
        (b.sentAt?.seconds || 0)
        -
        (a.sentAt?.seconds || 0)
    );


    updateMessageClassFilter();

    renderMessages();

  }
  catch(error){

    console.error(error);

    messagesTableBody.innerHTML = `
      <tr>
        <td colspan="10" class="message-empty">
          تعذر تحميل سجل الرسائل
        </td>
      </tr>
    `;

  }

}


function updateMessageClassFilter(){

  const currentValue =
    messageClassFilter.value;

  const classes = [
    ...new Set(
      teacherMessages
        .map(item=>item.className)
        .filter(Boolean)
    )
  ];

  classes.sort(
    (a,b)=>
      a.localeCompare(
        b,
        "ar",
        {numeric:true}
      )
  );

  messageClassFilter.innerHTML =
    `
      <option value="">
        جميع الفصول
      </option>
    `;

  classes.forEach(className=>{

    messageClassFilter.innerHTML += `
      <option value="${className}">
        ${className}
      </option>
    `;

  });


  if(classes.includes(currentValue)){
    messageClassFilter.value =
      currentValue;
  }

}


function getMessageDate(sentAt){

  if(
    !sentAt ||
    !sentAt.toDate
  ){

    return {
      date:"-",
      time:"-"
    };

  }

  const date =
    sentAt.toDate();

  return {

    date:
      date.toLocaleDateString(
        "ar-SA"
      ),

    time:
      date.toLocaleTimeString(
        "ar-SA",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      )

  };

}


function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function renderMessages(){

  const searchValue =
    messageSearch.value
      .trim()
      .toLowerCase();

  const selectedClass =
    messageClassFilter.value;


  const filtered =
    teacherMessages.filter(item=>{

      const matchesName =
        !searchValue
        ||
        String(item.studentName || "")
        .toLowerCase()
        .includes(searchValue);

      const matchesClass =
        !selectedClass
        ||
        item.className === selectedClass;

      return (
        matchesName &&
        matchesClass
      );

    });


  if(filtered.length === 0){

    messagesTableBody.innerHTML = `
      <tr>
        <td colspan="10" class="message-empty">
          لا توجد رسائل مطابقة
        </td>
      </tr>
    `;

    return;
  }


  let html = "";


  filtered.forEach(
    (item,index)=>{

      const dateInfo =
        getMessageDate(item.sentAt);

      const senderName =
        item.senderName
        ||
        item.teacherName
        ||
        teacherName;


      html += `
        <tr>

          <td>${index + 1}</td>

          <td class="student-name">
            ${escapeHtml(item.studentName)}
          </td>

          <td>
            ${escapeHtml(item.className)}
          </td>

          <td>
            <span class="sender-badge">
              المعلم:
              ${escapeHtml(senderName)}
            </span>
          </td>

          <td>
            ${escapeHtml(item.guardianPhone)}
          </td>

          <td>

            <details class="message-details">

              <summary>
                عرض الرسالة ▼
              </summary>

              <div class="message-scroll-box">
                ${escapeHtml(item.messageText)}
              </div>

            </details>

          </td>

          <td>
            ${dateInfo.date}
          </td>

          <td>
            ${dateInfo.time}
          </td>

          <td>
            <span class="status-sent">
              ${escapeHtml(item.status || "تم الإرسال")}
            </span>
          </td>

          <td>

            <button
              class="message-action-btn delete-message-btn"
              onclick="deleteTeacherMessage('${item.id}')"
            >
              حذف
            </button>

          </td>

        </tr>
      `;

    }
  );


  messagesTableBody.innerHTML =
    html;

}


messageSearch.addEventListener(
  "input",
  renderMessages
);

messageClassFilter.addEventListener(
  "change",
  renderMessages
);


window.deleteTeacherMessage =
async function(messageId){

  const message =
    teacherMessages.find(
      item=>item.id === messageId
    );

  if(!message){
    return;
  }

  const confirmDelete =
    confirm(
      `هل تريد حذف رسالة الطالب "${message.studentName}" من السجل؟`
    );

  if(!confirmDelete){
    return;
  }


  try{

    await deleteDoc(
      doc(
        db,
        "parentMessages",
        messageId
      )
    );

    teacherMessages =
      teacherMessages.filter(
        item=>item.id !== messageId
      );

    updateMessageClassFilter();

    renderMessages();

    alert(
      "تم حذف الرسالة من السجل"
    );

  }
  catch(error){

    console.error(error);

    alert(
      "تعذر حذف الرسالة"
    );

  }

};


window.deleteAllTeacherMessages =
async function(){

  if(teacherMessages.length === 0){

    alert(
      "لا توجد رسائل للحذف"
    );

    return;
  }

  const confirmDelete =
    confirm(
      "هل أنت متأكد من حذف جميع رسائلك؟ لا يمكن التراجع عن هذه العملية."
    );

  if(!confirmDelete){
    return;
  }


  try{

    for(const item of teacherMessages){

      await deleteDoc(
        doc(
          db,
          "parentMessages",
          item.id
        )
      );

    }

    teacherMessages = [];

    updateMessageClassFilter();

    renderMessages();

    alert(
      "تم حذف جميع الرسائل"
    );

  }
  catch(error){

    console.error(error);

    alert(
      "حدث خطأ أثناء حذف الرسائل"
    );

  }

};


window.printMessages =
function(){

  const searchValue =
    messageSearch.value
      .trim()
      .toLowerCase();

  const selectedClass =
    messageClassFilter.value;


  const filtered =
    teacherMessages.filter(item=>{

      return (

        (
          !searchValue
          ||
          String(item.studentName || "")
          .toLowerCase()
          .includes(searchValue)
        )

        &&

        (
          !selectedClass
          ||
          item.className === selectedClass
        )

      );

    });


  if(filtered.length === 0){

    alert(
      "لا توجد رسائل للطباعة"
    );

    return;
  }


  let rows = "";


  filtered.forEach(
    (item,index)=>{

      const dateInfo =
        getMessageDate(item.sentAt);

      rows += `
        <tr>
          <td>${index + 1}</td>
          <td>${escapeHtml(item.studentName)}</td>
          <td>${escapeHtml(item.className)}</td>
          <td>${escapeHtml(item.senderName || item.teacherName)}</td>
          <td>${escapeHtml(item.guardianPhone)}</td>
          <td class="message-cell">${escapeHtml(item.messageText)}</td>
          <td>${dateInfo.date}</td>
          <td>${dateInfo.time}</td>
          <td>${escapeHtml(item.status || "تم الإرسال")}</td>
        </tr>

  );


  const printWindow =
    window.open("","_blank");


  printWindow.document.write(`

window.saveAllGrades =
async function(){

  const className =
    classSelect.value;

  if(className === "اختر الفصل"){

    alert(
      "اختر الفصل أولًا"
    );

    return;
  }


  const inputs =
    document.querySelectorAll(
      ".grade-input"
    );


  for(const input of inputs){

    const studentName =
      input.dataset.student;

    const examName =
      input.dataset.exam;

    const maxDegree =
      Number(input.dataset.max);

    const value =
      input.value.trim();

    if(value === ""){
      continue;
    }

    const grade =
      Number(value);

    if(grade < 0){

      alert(
        `${studentName} لديه درجة سالبة في ${examName}`
      );

      return;
    }

    if(grade > maxDegree){

      alert(
        `${studentName} درجته أكبر من الدرجة النهائية في ${examName}`
      );

      return;
    }


    const existing =
      allGrades.find(item=>

        item.studentName === studentName
        &&
        item.className === className
        &&
        item.examName === examName
        &&
        item.teacherName === teacherName

      );


    if(existing){

      await updateDoc(
        doc(
          db,
          "grades",
          existing.id
        ),
        {
          grade,
          maxDegree
        }
      );

    }
    else{

      await addDoc(
        collection(db,"grades"),
        {
          teacherName,
          studentName,
          className,
          subject:"لغة إنجليزية",
          examName,
          grade,
          maxDegree
        }
      );

    }

  }


  alert(
    "تم حفظ جميع الدرجات"
  );

  await loadStudentsTable();

};


window.clearSelectedExam =
async function(){

  const className =
    classSelect.value;

  const examName =
    clearExamSelect.value;

  if(className === "اختر الفصل"){

    alert(
      "اختر الفصل أولًا"
    );

    return;
  }

  if(examName === "اختر اختبار للتفريغ"){

    alert(
      "اختر الاختبار المطلوب تفريغه"
    );

    return;
  }

  const allowedExam =
    exams.find(
      exam=>exam.examName === examName
    );

  if(!allowedExam){

    alert(
      "هذا الاختبار غير مسند لهذا الفصل"
    );

    return;
  }


  if(
    !confirm(
      `هل تريد تفريغ درجات "${examName}" لهذا الفصل؟`
    )
  ){
    return;
  }


  const snapshot =
    await getDocs(

      query(

        collection(db,"grades"),

        where(
          "teacherName",
          "==",
          teacherName
        ),

        where(
          "className",
          "==",
          className
        ),

        where(
          "examName",
          "==",
          examName
        )

      )

    );


  for(const item of snapshot.docs){

    await deleteDoc(
      doc(
        db,
        "grades",
        item.id
      )
    );

  }


  alert(
    "تم تفريغ درجات الاختبار المحدد"
  );

  await loadStudentsTable();

};
